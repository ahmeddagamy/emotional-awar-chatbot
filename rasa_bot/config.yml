# rasa_bot/config.yml
# ─────────────────────────────────────────────────────────────────────────────
# DENTAL CHATBOT – Rasa 3.6 NLU Pipeline & Policy Configuration
# ─────────────────────────────────────────────────────────────────────────────
version: "3.1"
recipe: default.v1
language: en

pipeline:
  # ── Tokenisation ──────────────────────────────────────────────────────────
  # SpacyTokenizer handles medical/dental compound words better than
  # WhitespaceTokenizer (e.g., "root canal", "dental implant")
  - name: SpacyNLP
    model: en_core_web_md
  - name: SpacyTokenizer
    intent_tokenization_flag: false
    intent_split_symbol: "/"

  # ── Feature extraction ────────────────────────────────────────────────────
  - name: SpacyFeaturizer
    pooling: mean
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # ── Intent / Entity classifier ────────────────────────────────────────────
  - name: DIETClassifier
    epochs: 200
    constrain_similarities: true
    entity_recognition: true
    number_of_transformer_layers: 2
    transformer_size: 256
    drop_rate: 0.25
    batch_size:
      - 64
      - 256
    embedding_dimension: 20
    evaluate_every_number_of_epochs: 20
    use_masked_language_model: true

  - name: EntitySynonymMapper

  # ── Fallback detection ────────────────────────────────────────────────────
  - name: FallbackClassifier
    threshold: 0.35
    ambiguity_threshold: 0.1

policies:
  # ── Remember exact conversation paths ────────────────────────────────────
  - name: MemoizationPolicy
    max_history: 5

  # ── Learn from stories using Transformer Embedding Dialogue ──────────────
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true

  # ── Rule-based policies (forms, fallbacks) ────────────────────────────────
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
